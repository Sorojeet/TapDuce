name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tap-deuce-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish the APK as a direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk tap-deuce.apk
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build tap-deuce.apk --target "$GITHUB_SHA" --title "Tap Deuce test build" --notes "Test build for Android. Download tap-deuce.apk, open it on your phone, and allow the install." --latest
