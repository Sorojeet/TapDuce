<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
@font-face { font-family: "Bungee"; src: url("fonts/bungee-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Rubik"; src: url("fonts/rubik-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: "Rubik"; src: url("fonts/rubik-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
</style>
</head><body><title>Tap Deuce</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a fixed 16:9 floodlit night match on clay. The menu sits on a stadium wallpaper, title left and options right. */
:root {
  color-scheme: dark;
  --night: #0a1233; --night-low: #243a7d; --ink: #0a1028; --panel: #131c45; --line: #33427f;
  --clay: #c9592f; --clay-lit: #e4763f; --clay-dark: #8e3a1f;
  --chalk: #fff8ee; --ball: #e4ff3a; --pink: #ff4f9a; --cyan: #25d7e8; --amber: #ffc24a;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Rubik", "Trebuchet MS", system-ui, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--chalk); overscroll-behavior: none; }
body { font-family: var(--body); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#game { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; }
#stage { position: absolute; left: 50%; top: 50%; overflow: hidden; container-type: size; background: var(--night); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

#board { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); pointer-events: none;
  display: grid; grid-template-columns: auto auto auto auto auto; align-items: center; gap: 10px;
  padding: 6px 12px; background: var(--ink); border: 2px solid var(--line); border-radius: 8px; box-shadow: 0 0 18px rgba(255,194,74,.25); }
.side { display: grid; gap: 4px; font: 700 12px/1 var(--body); letter-spacing: .05em; text-transform: uppercase; }
.side.r { justify-items: end; }
.pips { display: flex; gap: 4px; }
.pips i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); }
.pips i.on { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 6px var(--amber); }
.pts { font: 400 26px/1 var(--display); color: var(--amber); min-width: 1.1em; text-align: center; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(255,194,74,.6); }
.mid { max-width: 58px; font: 700 9px/1.15 var(--body); letter-spacing: .08em; text-transform: uppercase; text-align: center; color: var(--chalk); opacity: .8; }

.ctl { position: absolute; top: 8px; cursor: pointer; font: 700 12px/1 var(--body); color: var(--chalk); background: rgba(10,16,40,.75); border: 2px solid var(--line); border-radius: 6px; min-height: 36px; padding: 8px 10px; }
#exit { left: 10px; } #sound { right: 10px; }
.ctl:hover { background: var(--panel); }

.inmenu #board, .inmenu #exit { display: none; }
.wide #sound { display: none; }
#panel { position: absolute; inset: 0; overflow: auto; font: 500 max(11px, 2.9cqh)/1.35 var(--body); }
#panel.sheet { display: flex; padding-block: 2.5cqh; padding-left: 16px; padding-right: 16px; background: rgba(10,18,51,.62); }
#brand { display: none; position: absolute; left: 4.5cqw; top: 5cqh; width: 50cqw; }
#panel.root #brand { display: block; }
h1 { font: 400 15cqh/.9 var(--display); margin: 0; text-shadow: 0 .8cqh 0 var(--ink); }
h1 .a { color: var(--pink); } h1 .b { color: var(--cyan); }
#brand p { margin: 1.4cqh 0 0; font: 700 3.2cqh/1.2 var(--body); letter-spacing: .04em; color: var(--chalk); text-shadow: 0 1px 3px var(--ink); }
#screen { min-width: 0; }
#panel.root #screen { position: absolute; right: 4cqw; top: 11cqh; bottom: 4cqh; width: 35cqw; display: flex; flex-direction: column; justify-content: center; gap: 1.5cqh; }
#panel.sheet #screen { width: min(100%, 158cqh); margin: auto; padding: 2.8cqh 3cqh; background: var(--panel); border: 2px solid var(--line); border-top: .9cqh solid var(--amber); border-radius: 8px; box-shadow: 0 14px 40px rgba(0,0,0,.55); }
#panel.small #screen { width: min(100%, 92cqh); }
h2 { font: 400 6.6cqh/1 var(--display); margin: 0 0 1.4cqh; text-wrap: balance; }
#screen p { margin: 0 0 1.8cqh; }
.btn { display: block; width: 100%; min-height: 10.4cqh; padding: .6cqh 1.6cqh; cursor: pointer; font: 400 3.9cqh/1.05 var(--display); text-align: left; color: var(--chalk); background: rgba(19,28,69,.93); border: 2px solid var(--line); border-radius: 6px; }
.btn:hover:not(:disabled) { background: var(--line); }
.btn.go { color: var(--ink); background: var(--amber); border-color: var(--amber); }
.btn.go:hover { background: var(--ball); border-color: var(--ball); }
.btn.hot { color: var(--ink); background: var(--pink); border-color: var(--pink); }
.btn.hot:hover { background: var(--ball); border-color: var(--ball); }
.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5cqh; }
.levels .btn { text-align: center; font-size: 3.2cqh; padding: .6cqh .4cqh; }
.btn:disabled { cursor: not-allowed; color: #aab2d6; background: rgba(19,28,69,.8); }
.btn small { display: block; margin-top: .4cqh; font: 500 2.4cqh/1 var(--body); }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); grid-auto-flow: column; gap: 1.5cqh; margin-top: 1.8cqh; }
.row .btn { text-align: center; }
.how { display: grid; grid-template-columns: 58% minmax(0, 1fr); gap: 2.6cqh; align-items: center; }
.how canvas { position: static; width: 100%; height: auto; aspect-ratio: 2 / 1; border-radius: 6px; pointer-events: none; }
.how-text { min-width: 0; }
.how-text small { font: 700 2.4cqh/1 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--amber); }
.how-text h2 { margin-top: .8cqh; font-size: 5.4cqh; }
.dots { display: flex; gap: 1cqh; }
.dots i { width: 1.8cqh; height: 1.8cqh; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--amber); }
.lan-join { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.5cqh; margin-top: 1.5cqh; }
#code { min-width: 0; min-height: 10.4cqh; padding: 0 1.6cqh; font: 400 4.4cqh/1 var(--display); letter-spacing: .2em; text-align: center; color: var(--chalk); background: var(--ink); border: 2px solid var(--line); border-radius: 6px; -webkit-user-select: text; user-select: text; touch-action: auto; }
#code:focus { outline: 3px solid var(--cyan); }
.room { margin: 0 0 1.6cqh; font: 400 12cqh/1 var(--display); letter-spacing: .12em; color: var(--amber); text-align: center; }
.err { color: var(--pink); font-weight: 700; }
.rules { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.8cqh 3cqh; }
.rules b { display: block; color: var(--amber); }

.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5cqh; margin-bottom: 1.6cqh; }
.tab { min-height: 8cqh; cursor: pointer; font: 700 3cqh/1.1 var(--body); color: var(--chalk); background: var(--ink); border: 2px solid var(--line); border-radius: 6px; }
.tab.on { border-color: var(--amber); color: var(--amber); }
#skins { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 1cqh; }
.skin { min-width: 0; padding: .5cqh .3cqh .8cqh; cursor: pointer; color: var(--chalk); background: var(--ink); border: 2px solid var(--line); border-radius: 6px; font: 700 max(10px, 2.3cqh)/1.1 var(--body); }
.skin canvas { position: static; display: block; width: 100%; height: auto; aspect-ratio: 9 / 10; pointer-events: none; }
.skin.on { border-color: var(--amber); background: var(--line); }
.skin.other { opacity: .55; }

.tourney { display: grid; grid-template-columns: 27% minmax(0, 1fr); gap: 2.4cqh; }
.side-info { display: flex; flex-direction: column; gap: 1.2cqh; min-width: 0; }
.side-info h2 { font-size: 4.8cqh; margin: 0; }
.side-info p { margin: 0 0 auto !important; font-size: max(11px, 2.7cqh); }
.side-info .btn { text-align: center; font-size: 3cqh; min-height: 9cqh; }
.bracket { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0 .8cqh; min-width: 0; }
.round { display: flex; flex-direction: column; min-width: 0; }
.round h3 { margin: 0 0 .8cqh; font: 700 2.4cqh/1.1 var(--body); letter-spacing: .05em; text-transform: uppercase; color: var(--amber); }
.pairs { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: .5cqh; }
.pair { display: grid; gap: .25cqh; padding-right: .6cqh; border: 2px solid var(--line); border-left: 0; border-radius: 0 6px 6px 0; }
.chip { display: flex; align-items: center; gap: .6cqh; min-width: 0; min-height: 4.3cqh; padding: .1cqh .6cqh; background: var(--ink); border-radius: 4px; font: 700 max(9px, 2.3cqh)/1.1 var(--body); overflow: hidden; }
.chip i { flex: none; width: 1.8cqh; height: 1.8cqh; border-radius: 50%; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.you { color: var(--ink); background: var(--amber); }
.chip.out { opacity: .42; }
.chip.tbd { color: #8c95bd; }
button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
</style>

<div id="game">
  <div id="stage">
    <canvas id="c" aria-label="Floodlit clay tennis court. Tap the left side to move the left robot and the right side to move the right robot."></canvas>
    <div id="board" aria-live="polite">
      <div class="side"><span id="n0">Pink</span><span class="pips" id="g0"><i></i><i></i></span></div>
      <div class="pts" id="p0">0</div>
      <div class="mid" id="mid">Best<br>of 3</div>
      <div class="pts" id="p1">0</div>
      <div class="side r"><span id="n1">Cyan</span><span class="pips" id="g1"><i></i><i></i></span></div>
    </div>
    <button id="exit" class="ctl" type="button">Menu</button>
    <button id="sound" class="ctl" type="button">Sound on</button>
    <div id="panel">
      <div id="brand">
        <h1><span class="a">Tap</span><br><span class="b">Deuce</span></h1>
        <p>Night session tennis for jet-booted robots</p>
      </div>
      <div id="screen"></div>
    </div>
  </div>
</div>

<script>
(() => {
  const css = getComputedStyle(document.documentElement);
  const tok = n => css.getPropertyValue('--' + n).trim();
  const C = { night: tok('night'), low: tok('night-low'), ink: tok('ink'), clay: tok('clay'), lit: tok('clay-lit'), dark: tok('clay-dark'), chalk: tok('chalk'), ball: tok('ball'), pink: tok('pink'), cyan: tok('cyan'), amber: tok('amber') };
  const FONT = tok('display');
  const SKINS = [
    { name: 'Pink', main: '#ff4f9a', deep: '#a81f62', pale: '#ffa6cb', pat: '', hat: '' },
    { name: 'Cyan', main: '#25d7e8', deep: '#0b8798', pale: '#a8f4fb', pat: '', hat: '' },
    { name: 'Ember', main: '#ff7a2e', deep: '#b83b0a', pale: '#ffc38a', pat: 'bolt', hat: 'horns' },
    { name: 'Frost', main: '#9fdcff', deep: '#4a8fd0', pale: '#f0fbff', pat: 'dots', hat: 'phones' },
    { name: 'Jungle', main: '#38c172', deep: '#147a43', pale: '#a8f0c4', pat: 'stripes', hat: 'bandana' },
    { name: 'Royal', main: '#7a4dff', deep: '#3d1fa8', pale: '#c8b4ff', pat: 'check', hat: 'crown' },
    { name: 'Gold', main: '#f5c033', deep: '#a8740a', pale: '#fff0b0', pat: '', hat: 'tophat' },
    { name: 'Tiger', main: '#ff9a1f', deep: '#b85a00', pale: '#ffd79a', pat: 'stripes', hat: 'ears' },
    { name: 'Mint', main: '#6ff0c8', deep: '#22a583', pale: '#d4fff0', pat: 'dots', hat: 'propeller' },
    { name: 'Cherry', main: '#ef3347', deep: '#8f1020', pale: '#ff9aa4', pat: 'check', hat: 'cap' },
    { name: 'Angel', main: '#e4e0ff', deep: '#a09ad6', pale: '#ffffff', pat: '', hat: 'halo' },
    { name: 'Punk', main: '#e040fb', deep: '#8e10a8', pale: '#f3b0ff', pat: 'stripes', hat: 'mohawk' },
    { name: 'Ocean', main: '#1f7bff', deep: '#0c3fa8', pale: '#92c0ff', pat: 'stars', hat: 'cap' },
    { name: 'Bubble', main: '#ff9ad6', deep: '#d94f9f', pale: '#ffe0f3', pat: 'dots', hat: 'flower' },
    { name: 'Retro', main: '#c7b28a', deep: '#7f6a45', pale: '#efe3c8', pat: 'circuit', hat: 'phones' },
    { name: 'Galaxy', main: '#4a3bb0', deep: '#1d1560', pale: '#9a8cff', pat: 'stars', hat: 'halo' },
  ];
  const NAMES = ['Pink', 'Cyan'], COLORS = [C.pink, C.cyan], DEEP = ['#a81f62', '#0b8798'], PALE = ['#ffa6cb', '#a8f4fb'];
  const $ = id => document.getElementById(id);
  const game = $('game'), stage = $('stage'), cv = $('c'), mainCtx = cv.getContext('2d');
  let ctx = mainCtx;
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Match format.
  let POINTS_TO_WIN = 5;
  const GAMES_TO_WIN = 2, AUTO_SERVE = 3.5, RALLY_LIMIT = 7, IDLE_LIMIT = 6;

  // World is always 16:9.
  const W = 1067, H = 600, GROUND = 520, NET_H = 92, NET_TOP = GROUND - NET_H;
  const BALL_G = 420, PLAYER_G = 1150, LEAP_UP = -480, SERVE_SPEED = 600, PERFECT_SPEED = 840, ROOF = 120, ZOOM = 1.15, REACH = 68, STAND = GROUND - 44, RACKET = 52;
  const NX = W / 2, LINE_L = 64, LINE_R = W - 64;
  const LIGHTS = [[190, 105], [877, 105]];
  let scale = 1, rotated = false, dpr = 1, layers = null;

  function resize() {
    const vw = game.clientWidth, vh = game.clientHeight;
    rotated = vh > vw;
    const long = rotated ? vh : vw, short = rotated ? vw : vh;
    const w = Math.floor(Math.min(long, short * 16 / 9)), h = Math.floor(w * 9 / 16);
    stage.style.width = w + 'px'; stage.style.height = h + 'px';
    stage.style.transform = `translate(-50%, -50%)${rotated ? ' rotate(90deg)' : ''}`;
    dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = w * dpr; cv.height = h * dpr;
    scale = w / W;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    buildLayers();
  }

  /* ---------- pre-rendered scenery ---------- */
  function layer(fn) {
    const c = document.createElement('canvas'), k = scale * dpr;
    c.width = Math.ceil(W * k); c.height = Math.ceil(H * k);
    const g = c.getContext('2d'); g.scale(k, k); fn(g);
    return c;
  }
  function seeded(n) { let s = n; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

  function buildLayers() {
    const sky = layer(g => {
      const grad = g.createLinearGradient(0, 0, 0, 300);
      grad.addColorStop(0, C.night); grad.addColorStop(1, C.low);
      g.fillStyle = grad; g.fillRect(0, 0, W, 320);
      const r = seeded(11);
      g.fillStyle = C.chalk;
      for (let k = 0; k < 70; k++) { g.globalAlpha = .25 + r() * .6; g.beginPath(); g.arc(r() * W, r() * 150, .6 + r() * 1.1, 0, 6.3); g.fill(); }
      g.globalAlpha = 1;
      // Stadium bowl: stepped tiers rising from the middle toward both ends.
      g.fillStyle = '#0d1538';
      g.beginPath(); g.moveTo(0, 96);
      g.quadraticCurveTo(W / 2, 208, W, 96);
      g.lineTo(W, 440); g.lineTo(0, 440); g.closePath(); g.fill();
      g.strokeStyle = 'rgba(255,255,255,.14)'; g.lineWidth = 3;
      g.beginPath(); g.moveTo(0, 96); g.quadraticCurveTo(W / 2, 208, W, 96); g.stroke();
      // Light towers.
      for (const [x, y] of LIGHTS) {
        g.fillStyle = '#1b2556'; g.fillRect(x - 4, y + 8, 8, 140);
        g.fillStyle = '#26316b'; g.fillRect(x - 40, y - 18, 80, 30);
        g.fillStyle = '#fff6d8';
        for (let a = 0; a < 4; a++) for (let b = 0; b < 2; b++) { g.beginPath(); g.arc(x - 28 + a * 19, y - 9 + b * 12, 4.4, 0, 6.3); g.fill(); }
      }
    });

    const crowdLayer = odd => layer(g => {
      const r = seeded(odd ? 91 : 47);
      const shirts = ['#ff8a6b', '#ffd166', '#7fe0c8', '#b9a4ff', '#ff9ac7', '#8ed0ff', '#f6f1e6', '#e9604d', '#5c7cff'];
      const skins = ['#ffd3b0', '#e0a678', '#a86f48', '#6f4730'];
      for (let row = 0; row < 8; row++) {
        if ((row % 2 === 1) !== odd) continue;
        const y = 232 + row * 27, size = 6 + row * .55, shade = .3 + row * .055;
        const rise = (x) => Math.pow(Math.abs(x - W / 2) / (W / 2), 2) * 86;
        for (let x = -6; x < W + 8; x += size * 2.5) {
          if (r() < .07) continue;
          const px = x + r() * 4, py = y - rise(px) * (1 - row / 9) + r() * 3;
          g.globalAlpha = shade;
          g.fillStyle = shirts[Math.floor(r() * shirts.length)];
          g.beginPath(); g.ellipse(px, py + size * 1.5, size * 1.15, size * 1.05, 0, 0, 6.3); g.fill();
          g.fillStyle = skins[Math.floor(r() * skins.length)];
          g.beginPath(); g.arc(px, py, size * .78, 0, 6.3); g.fill();
        }
      }
      g.globalAlpha = 1;
    });

    const front = layer(g => {
      // Advertising boards.
      const boards = g.createLinearGradient(0, 436, 0, 492);
      boards.addColorStop(0, '#16235c'); boards.addColorStop(1, '#0b1236');
      g.fillStyle = boards; g.fillRect(0, 436, W, 56);
      g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(0, 436, W, 2);
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = `26px ${FONT}`;
      const words = ['TAP DEUCE', 'BEST OF 3', 'JET BOOTS', 'NIGHT SESSION'];
      words.forEach((t, n) => {
        const x = W * (n + .5) / words.length;
        g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(x - W / 8 + 3, 442, W / 4 - 6, 44);
        g.fillStyle = n % 2 ? C.amber : C.chalk; g.globalAlpha = .82; g.fillText(t, x, 465); g.globalAlpha = 1;
      });

      // Clay surface, darker outside the lines, with a pool of floodlight.
      const out = g.createLinearGradient(0, 488, 0, 600);
      out.addColorStop(0, C.clay); out.addColorStop(1, C.dark);
      g.fillStyle = out; g.fillRect(0, 488, W, 112);
      const edge = (base, y, sign) => base + sign * (GROUND - y);
      const tl = edge(LINE_L, 488, 1), tr = edge(LINE_R, 488, -1), bl = edge(LINE_L, 620, 1), br = edge(LINE_R, 620, -1);
      const path = () => { g.beginPath(); g.moveTo(tl, 488); g.lineTo(tr, 488); g.lineTo(br, 620); g.lineTo(bl, 620); g.closePath(); };
      const lit = g.createLinearGradient(0, 488, 0, 600);
      lit.addColorStop(0, C.lit); lit.addColorStop(1, C.clay);
      path(); g.fillStyle = lit; g.fill();
      const r = seeded(29);
      for (let k = 0; k < 900; k++) {
        const y = 490 + r() * 110, x = r() * W;
        g.fillStyle = r() < .5 ? 'rgba(255,220,180,.09)' : 'rgba(70,20,5,.13)';
        g.fillRect(x, y, 1.5 + r() * 5, 1);
      }
      for (const [x] of LIGHTS) {
        const pool = g.createRadialGradient(x + (x < W / 2 ? 120 : -120), 540, 10, x + (x < W / 2 ? 120 : -120), 540, 330);
        pool.addColorStop(0, 'rgba(255,240,200,.2)'); pool.addColorStop(1, 'rgba(255,240,200,0)');
        g.fillStyle = pool; g.fillRect(0, 488, W, 112);
      }
      // Lines.
      g.strokeStyle = C.chalk; g.lineJoin = 'round'; g.lineWidth = 4;
      path(); g.stroke();
      g.lineWidth = 3; g.beginPath();
      const sx1 = NX - (NX - LINE_L) * .55, sx2 = NX + (LINE_R - NX) * .55;
      g.moveTo(sx1 + 16, 488); g.lineTo(sx1 - 34, 620);
      g.moveTo(sx2 - 16, 488); g.lineTo(sx2 + 34, 620);
      g.moveTo(sx1 - 6, 548); g.lineTo(sx2 + 6, 548);
      g.stroke();
      // Edge vignette.
      const v = g.createRadialGradient(W / 2, 330, 280, W / 2, 330, 700);
      v.addColorStop(0, 'rgba(5,8,28,0)'); v.addColorStop(1, 'rgba(5,8,28,.5)');
      g.fillStyle = v; g.fillRect(0, 0, W, H);
    });
    layers = { sky, a: crowdLayer(false), b: crowdLayer(true), front };
  }

  /* ---------- state ---------- */
  const player = i => ({ i, dir: i ? -1 : 1, x: 0, y: STAND, vx: 0, vy: 0, tapAt: -9, swing: 0, armed: false, demoWait: 0, flame: 0, mood: 0, blink: 2 + i });
  const S = {
    demo: true, solo: false, phase: 'serve', t: 0, players: [player(0), player(1)],
    ball: { x: 0, y: 0, vx: 0, vy: 0, bounces: 0, last: -1, trail: [] },
    points: [0, 0], games: [0, 0], server: 0, firstServer: 0, rally: 0, wait: 0, call: null, bits: [], marks: [], flashes: [], shake: 0, serveDelay: 1, sinceHit: 0, hitFlash: 0, net: null, fx: [],
  };
  const home = p => p.i ? W * 0.87 : W * 0.13;

  function resetPoint() {
    S.phase = 'serve'; S.call = null; S.rally = 0; S.serveDelay = S.demo ? 99 : (S.solo && S.server === 1) ? 1.2 : AUTO_SERVE; S.sinceHit = 0; S.marks = []; S.servePhase = Math.random() * 6.28;
    for (const p of S.players) { p.x = home(p); p.y = STAND; p.vx = p.vy = 0; p.swing = 0; p.armed = false; p.mood = 0; }
    const b = S.ball; b.vx = b.vy = 0; b.bounces = 0; b.last = -1; b.trail = [];
    syncHud();
  }
  function newMatch(demo, solo) {
    S.demo = demo; S.solo = !!solo;
    S.points = [0, 0]; S.games = [0, 0]; S.server = 0; S.firstServer = 0; S.bits = [];
    resetPoint();
  }

  // The floor takes the sting out of the ball, but always leaves it high enough to hit.
  const floorBounce = vy => -Math.max(Math.abs(vy) * .6, 270);

  // Height of the ball as it reaches the net, following its bounces.
  function heightAtNet(b) {
    let x = b.x, y = b.y, vy = b.vy;
    for (let k = 0; k < 600; k++) {
      const d = 1 / 120, px = x;
      vy += BALL_G * d; x += b.vx * d; y += vy * d;
      if (y < ROOF + 11) { y = ROOF + 11; vy = Math.abs(vy); }
      if (y > GROUND - 11) { y = GROUND - 11; vy = floorBounce(vy); }
      if ((px - NX) * (x - NX) <= 0) return y;
    }
    return 0;
  }
  // Lifts a shot just enough to carry over the net.
  function liftOverNet(b) {
    for (let k = 0; k < 60 && heightAtNet(b) > NET_TOP - 30; k++) b.vy -= 25;
  }

  function serve() {
    const ball = S.ball, a = Math.sin(S.t * 3.4 + S.servePhase) * .6 + (Math.random() - .5) * .08; // The ball's height at the moment of the serve sets the angle.
    ball.vx = Math.cos(a) * SERVE_SPEED * S.players[S.server].dir;
    ball.vy = Math.sin(a) * SERVE_SPEED;
    liftOverNet(ball);
    ball.last = S.server; S.phase = 'rally'; S.call = null; S.sinceHit = 0;
    // The racket hits by itself, but a robot left alone for IDLE_LIMIT seconds stops playing, so idle rallies still end.
    for (const p of S.players) { p.armed = false; p.tapAt = S.t; }
    S.players[S.server].swing = 1;
    sfx(420, 0.08);
  }

  // Brick-breaker rebound: the contact point on the racket sets the angle. Only a perfect middle hit adds speed.
  function hit(p) {
    const ball = S.ball;
    const off = Math.max(-1, Math.min(1, (ball.y - (p.y - 16)) / REACH));
    const middle = Math.abs(off) < .3;
    const speed = middle ? PERFECT_SPEED : SERVE_SPEED;
    if (middle) {
      // A middle hit flies straight and fast, with just enough lift to hold its line across the court.
      ball.vx = speed * p.dir;
      ball.vy = -0.5 * BALL_G * (W * .78) / speed;
    } else {
      const a = off > 0 ? off * .5 : off * 1.05;
      ball.vx = Math.cos(a) * speed * p.dir;
      ball.vy = Math.sin(a) * speed + p.vy * .12;
    }
    ball.x = p.x + p.dir * (RACKET + REACH * .55);
    liftOverNet(ball);
    ball.last = p.i; S.rally++; p.swing = 1; S.sinceHit = 0;
    for (const q of S.players) q.armed = false;
    S.hitFlash = 1;
    spark(ball.x, ball.y, middle ? 18 : 7, C.ball);
    if (middle) S.shake = calm ? 0 : 6;
    sfx(middle ? 720 : 520, middle ? 0.1 : 0.06);
  }

  function endPoint(winner, word) {
    if (S.phase !== 'rally') return;
    S.phase = 'over'; S.wait = 2;
    const loser = 1 - winner;
    S.points[winner]++;
    S.players[winner].mood = 1; S.players[loser].mood = -1;
    S.winner = winner;
    let line = `${S.points[0]}–${S.points[1]}`;
    S.pending = 'point';
    const top = Math.max(S.points[0], S.points[1]), low = Math.min(S.points[0], S.points[1]);
    if (top === low && top >= POINTS_TO_WIN - 1) line = 'Deuce';
    else if (top >= POINTS_TO_WIN - 1) {
      const ahead = S.points[0] > S.points[1] ? 0 : 1;
      line = `${line} · ${top >= POINTS_TO_WIN && top - low === 1 ? 'Advantage' : S.games[ahead] === GAMES_TO_WIN - 1 ? 'Match point' : 'Game point'} ${NAMES[ahead]}`;
    }
    const lead = S.points[winner] - S.points[loser];
    if (S.points[winner] >= POINTS_TO_WIN && lead >= 2) {
      S.games[winner]++;
      if (S.games[winner] >= GAMES_TO_WIN) { S.pending = 'match'; line = `${NAMES[winner]} wins the match`; S.wait = 3; confetti(winner); }
      else { S.pending = 'game'; line = `Game to ${NAMES[winner]}`; S.wait = 2.4; }
    }
    S.call = { word, line, t: 0, color: COLORS[winner] };
    for (let k = 0; k < 10; k++) S.flashes.push(flash(Math.random() * .8));
    sfx(240, 0.2);
    syncHud();
  }
  function afterPoint() {
    if (S.pending === 'point') {
      // Serve changes every point, but every two points at deuce so someone can always get 2 ahead.
      const late = Math.min(S.points[0], S.points[1]) >= POINTS_TO_WIN - 1;
      if (!late || (S.points[0] + S.points[1]) % 2 === 0) S.server = 1 - S.server;
      return resetPoint();
    }
    if (S.pending === 'game') {
      S.points = [0, 0]; S.firstServer = 1 - S.firstServer; S.server = S.firstServer;
      return resetPoint();
    }
    S.phase = 'done';
    if (S.match.tour) return tournamentResult(S.winner === 0);
    if (S.net === 'host') netSend({ end: { w: S.winner, g: S.games } });
    show('result');
  }

  function tap(i) {
    if (S.net === 'guest') { netSend({ tap: 1 }); return; }
    if (S.net === 'host') i = 0;
    tapSide(i);
  }
  function tapSide(i) {
    if (S.demo) return;
    if (S.solo) i = 0;
    if (S.phase === 'serve') { if (i === S.server) serve(); return; }
    if (S.phase === 'rally') leap(S.players[i]);
  }
  // A tap fires the jet boots upward and readies a swing at an incoming ball.
  function leap(p) {
    p.vy = LEAP_UP; p.tapAt = S.t;
    if (S.ball.last !== p.i) p.armed = true;
    p.flame = 1;
    sfx(p.i ? 880 : 660, 0.03, 'triangle');
    if (p.y > STAND - 6) dust(p.x, GROUND + 2, 6);
  }
  function spark(x, y, n, c) {
    if (S.net === 'host') S.fx.push(['spark', x, y, n, c]);
    for (let k = 0; k < n; k++) {
      const a = Math.random() * 6.28, v = 80 + Math.random() * 190;
      S.bits.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: .25 + Math.random() * .25, c, r: 2 + Math.random() * 1.5, g: 300 });
    }
  }
  function dust(x, y, n) {
    if (S.net === 'host') S.fx.push(['dust', x, y, n]);
    for (let k = 0; k < n; k++) {
      S.bits.push({ x: x + (Math.random() - .5) * 18, y, vx: (Math.random() - .5) * 120, vy: -20 - Math.random() * 55, life: .35 + Math.random() * .3, max: .65, c: '#f0a678', r: 5 + Math.random() * 6, g: 40, soft: true });
    }
  }
  function confetti(winner) {
    if (S.net === 'host') S.fx.push(['confetti', winner]);
    const cols = [COLORS[winner], C.amber, C.chalk, PALE[winner]];
    for (let k = 0; k < 150; k++) {
      S.bits.push({ x: Math.random() * W, y: -20 - Math.random() * 320, vx: (Math.random() - .5) * 80, vy: 80 + Math.random() * 130, life: 4, c: cols[k % 4], r: 3 + Math.random() * 3, g: 10, paper: true, spin: Math.random() * 6 });
    }
  }
  function flash(delay) {
    const a = Math.random() < .5;
    return { x: Math.random() * W, y: 200 + Math.random() * 205, t: -(delay || 0), size: 6 + Math.random() * 9 };
  }
  // Where the ball will cross this robot's racket, following its bounces.
  function intercept(p) {
    const b = S.ball, tx = p.x + p.dir * RACKET;
    let x = b.x, y = b.y, vy = b.vy;
    if ((tx - x) * b.vx <= 0) return 300;
    for (let k = 0; k < 400; k++) {
      const d = 1 / 60; vy += BALL_G * d; x += b.vx * d; y += vy * d;
      if (y < ROOF + 11) { y = ROOF + 11; vy = Math.abs(vy); }
      if (y > GROUND - 11) { y = GROUND - 11; vy = floorBounce(vy); }
      if ((tx - x) * b.vx <= 0) return y;
    }
    return 300;
  }
  function demoBrain(p, dt) {
    if (S.phase !== 'rally') return;
    p.demoWait -= dt;
    const incoming = S.ball.last !== p.i;
    const goal = (incoming ? intercept(p) : 300) + 16 + (Math.sin(S.t * .7 + p.i) * 26);
    if (p.demoWait <= 0 && ((p.y > goal && p.vy > -40) || (incoming && !p.armed))) { leap(p); p.demoWait = 0.16; }
  }

  // Solo difficulties, also used by the tournament rounds.
  const LEVELS = [
    { slip: 2.2, err: 1.6, react: .12 },
    { slip: 1.2, err: 1.1, react: .03 },
    { slip: .55, err: .8, react: -.02, idle: 360, reach: 1.15 },
    { slip: .18, err: .55, react: -.05, focus: true, wait: .15, idle: 370, reach: 1.45 },
    { slip: .015, err: .25, react: -.05, focus: true, wait: .13, idle: 350, reach: 2.4 },
  ];
  const DIFFICULTIES = ['Easy', 'Medium', 'Hard', 'Extreme', 'Impossible'];

  // The computer reacts quickly and usually reads the ball well. Fast perfect shots fool it more often.
  function cpuBrain(p, dt) {
    if (S.phase !== 'rally') return;
    const ball = S.ball, incoming = ball.last !== p.i, key = S.rally + ':' + ball.last;
    p.demoWait -= dt;
    if (key !== p.key) {
      p.key = key;
      const fast = Math.abs(ball.vx) > SERVE_SPEED * 1.1;
      // Small aiming errors most of the time, with an occasional bad misjudgment. It concentrates harder when trailing.
      const behind = S.points[1] < S.points[0];
      const skill = LEVELS[S.level];
      const slip = Math.random() < (fast ? .26 : .09) * (behind ? .6 : 1) * skill.slip;
      const side = Math.random() < .5 ? -1 : 1;
      p.err = slip ? side * (118 + Math.random() * 50) : (Math.random() - .5) * (fast ? 110 : 70) * skill.err;
      p.react = .05 + Math.random() * .14 + skill.react;
